<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molecule, biologic and dose form test page</title>
<!-- Dev only. Serve the repo root and open /dev/molecule.html
     ?only=azithromycin,fluoxetine,antibody limits the molecules and biologic formats, ?theme=dark limits the theme. -->
<!-- ?bounds=1 outlines the circle each molecule is fitted to. -->
<link rel="stylesheet" href="../site/css/tokens.css">
<link rel="stylesheet" href="../site/assets/fonts/fonts.css">
<style>
  /* The two themes side by side, so the dark tokens are repeated here from tokens.css. */
  .theme, body { --accent: #4F7CC4; }
  .theme[data-theme='light'] { --paper: #ECEAE5; --ink: #111111; --mute: #5E5D59; }
  .theme[data-theme='dark'] { --paper: #0D0D0D; --ink: #DEDCD6; --mute: #8F8E8A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-text); }
  h1, h2, h3 { font: inherit; margin: 0; }
  h1 { font-family: var(--font-display); font-size: 1.5625rem; padding: 24px 24px 0; }
  h2 { font-size: 1.25rem; padding-bottom: 12px; }
  h3 { color: var(--mute); padding: 24px 0 8px; }
  .theme { background: var(--paper); color: var(--ink); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .cell { flex: none; }
  .bounds .cell { border-radius: 50%; outline: 1px solid var(--mute); }
  .large .cell { width: 320px; height: 320px; }
  .small .cell { width: 140px; height: 140px; }
  .small { padding-top: 12px; }
  .glyphs .item { width: 96px; text-align: center; color: var(--mute); font-size: 0.8rem; }
  .glyphs .g { width: 96px; height: 96px; }
  .glyphs.tiny .item { width: 60px; }
  .glyphs.tiny .g { width: 28px; height: 28px; margin: 0 auto; }
  .stepper { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 24px; }
  .stepper .cell { width: 320px; height: 320px; max-width: 100%; resize: both; overflow: hidden; }
  .bounds .stepper .cell { border-radius: 0; }
  button, select { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 4px 0; cursor: pointer; }
</style>
</head>
<body>
<h1>Molecule, biologic and dose form test page</h1>

<div class="stepper">
  <div class="cell" id="live"></div>
  <div>
    <p><select id="pick" aria-label="Molecule"></select></p>
    <p><button id="less" type="button">Less</button> &nbsp; <span id="level"></span> &nbsp; <button id="more" type="button">More</button></p>
    <p><button id="none" type="button">Clear</button></p>
    <p>Drag the corner of the square to resize it</p>
  </div>
</div>

<div id="out"></div>

<script type="module">
import { renderMolecule } from '../site/js/molecule.js';
import { renderBiologic } from '../site/js/biologic.js';
import { renderDoseForm } from '../site/js/glyph.js';

const params = new URLSearchParams(location.search);
if (params.get('bounds')) document.body.classList.add('bounds');
const only = params.get('only')?.split(',');
const structures = await (await fetch('fixtures/structures.json')).json();

// Synthetic cases the real molecules do not cover.
const strip = s => ({ ...s, atoms: s.atoms.map(a => a.slice(0, 3)) });
structures['metronidazole, charges inferred'] = strip(structures.metronidazole);
structures['tiotropium, charges inferred'] = strip(structures.tiotropium);
structures['glycine zwitterion'] = {
  atoms: [[-1.3, 0.38, 'N', 1], [-0.43, -0.12, 'C'], [0.43, 0.38, 'C'], [1.3, -0.12, 'O', -1], [0.43, 1.38, 'O']],
  bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1], [2, 4, 2]],
};

const names = Object.keys(structures).filter(n => !only || only.includes(n));
const themes = params.get('theme') ? [params.get('theme')] : ['light', 'dark'];
const make = (tag, cls, parent, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  parent?.appendChild(n);
  return n;
};

// Every pillShapes and forms entry of data/vocab.json, then the two extra shape names still accepted.
const SHAPES = ['round', 'oval', 'oblong', 'capsule', 'diamond', 'triangle', 'square', 'rectangle', 'pentagon', 'hexagon', 'octagon',
  'vial', 'pen', 'inhaler', 'syringe', 'patch', 'dropper', 'shield', 'drop'];
const FORMS = ['tablet', 'capsule', 'solution', 'suspension', 'powder', 'injection', 'inhalation', 'cream', 'ointment', 'gel',
  'patch', 'drops', 'spray', 'suppository', 'lozenge', 'implant'];

// One biologic per format; isotype null falls back to the format name, a missing mass leaves level 4 as level 3.
const biologics = {
  antibody: { format: 'antibody', isotype: 'IgG1 κ', massKDa: 148 },
  bispecific: { format: 'bispecific', isotype: 'IgG4', massKDa: 146 },
  fragment: { format: 'fragment', isotype: 'IgG1 κ Fab', massKDa: 48 },
  'fc-fusion': { format: 'fc-fusion', isotype: null, massKDa: 150 },
  conjugate: { format: 'conjugate', isotype: 'IgG1 κ', massKDa: 153 },
  peptide: { format: 'peptide', isotype: null, massKDa: 4.1 },
  protein: { format: 'protein', isotype: null, massKDa: 30.4 },
  oligonucleotide: { format: 'oligonucleotide', isotype: null, massKDa: 7.5 },
};
const kinds = Object.keys(biologics).filter(n => !only || only.includes(n));

const out = document.getElementById('out');
for (const theme of themes) {
  const sec = make('section', 'theme', out);
  sec.dataset.theme = theme;
  make('h2', '', sec, theme === 'dark' ? 'Dark' : 'Light');

  make('h3', '', sec, 'Dose forms, by pill shape, in the accent');
  for (const size of ['', ' tiny']) {
    const row = make('div', 'row glyphs' + size, sec);
    for (const shape of SHAPES) {
      const item = make('div', 'item', row);
      renderDoseForm(make('div', 'g', item), { shape, desc: `${shape} test glyph` }, 'tablet');
      make('div', '', item, shape);
    }
  }
  make('h3', '', sec, 'Dose forms, from the form alone');
  const forms = make('div', 'row glyphs', sec);
  for (const form of FORMS) {
    const item = make('div', 'item', forms);
    renderDoseForm(make('div', 'g', item), undefined, form);
    make('div', '', item, form);
  }

  for (const name of kinds) {
    make('h3', '', sec, name);
    for (const size of ['large', 'small']) {
      const row = make('div', 'row ' + size, sec);
      for (let reveal = 0; reveal <= 4; reveal++) renderBiologic(make('div', 'cell', row), biologics[name], { reveal });
    }
  }
  for (const name of names) {
    make('h3', '', sec, name);
    for (const size of ['large', 'small']) {
      const row = make('div', 'row ' + size, sec);
      for (let reveal = 0; reveal <= 4; reveal++) renderMolecule(make('div', 'cell', row), structures[name], { reveal });
    }
  }
}

// In-place updates.
const live = document.getElementById('live'), pick = document.getElementById('pick'), label = document.getElementById('level');
for (const n of [...Object.keys(structures), ...Object.keys(biologics)]) make('option', '', pick, n);
let reveal = Number(params.get('reveal') ?? 0);
pick.value = params.get('live') || 'sildenafil';
const show = () => {
  label.textContent = `Reveal ${reveal}`;
  if (biologics[pick.value]) renderBiologic(live, biologics[pick.value], { reveal });
  else renderMolecule(live, structures[pick.value], { reveal });
};
// Each renderer owns the element it draws in, so hand it over empty when the kind of answer changes.
pick.onchange = () => { renderMolecule(live, null); renderBiologic(live, null); show(); };
document.getElementById('less').onclick = () => { reveal = Math.max(0, reveal - 1); show(); };
document.getElementById('more').onclick = () => { reveal = Math.min(4, reveal + 1); show(); };
document.getElementById('none').onclick = () => { renderBiologic(live, null); label.textContent = String(renderMolecule(live, null)); };
show();
window.ready = true;
</script>
</body>
</html>
